<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduBot - Asistente Virtual</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <!-- Encabezado con logo -->
    <div class="header">
      <div class="logo"><img src="EduBot-logo.png" alt="edubot-logo"></div>
      <div class="header-textos">
        <p class="titulo">EduBot</p>
        <p class="subtitulo">Asistente virtual de la institución</p>
      </div>
    </div>

    <!-- Ventana del chat -->
    <div class="chat-container">
      <div class="chat-window" id="chatWindow">
        <!-- Aquí se van agregando los mensajes con JavaScript -->
      </div>

      <!-- Opciones del chatbot -->
      <ul class="opciones" id="opciones">
        <!-- Aquí se agregan las opciones (li) dinámicamente -->
      </ul>
    </div>

    <!-- Zona de escritura libre -->
    <div class="input-area">
      <label for="entradaUsuario">Escribe tu pregunta:</label>
      <input type="text" id="entradaUsuario" placeholder="Ej: ¿Cuál es el horario?">
      <div class="botones-accion">
        <button id="btnEnviar">Enviar</button>
        <button id="btnAtras">⬅ Atrás</button>
        <button id="btnInicio">🏠 Menú principal</button>
      </div>
    </div>

    <p class="pie">EduBot - Proyecto de formación SENA</p>

  </div>

  <script src="script.js"></script>
</body>

</html>
